version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_RASA_URL=http://rasa:5005
      - REACT_APP_STT_URL=http://stt:5006
      - REACT_APP_TTS_URL=http://tts:5007

  rasa:
    build:
      context: .
      dockerfile: rasa/Dockerfile
    ports:
      - "5005:5005"
    environment:
      - RASA_ACTIONS_URL=http://rasa-actions:5055
    depends_on:
      - rasa-actions

  rasa-actions:
    build:
      context: .
      dockerfile: rasa/Dockerfile
    command: rasa run actions --port 5055
    ports:
      - "5055:5055"

  stt:
    build:
      context: .
      dockerfile: stt/Dockerfile
    ports:
      - "5006:5006"

  tts:
    build:
      context: .
      dockerfile: tts/Dockerfile
    ports:
      - "5007:5007"