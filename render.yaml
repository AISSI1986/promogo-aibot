# Promogo Multilingual AI Chatbot Blueprint
# Deploy a complete multilingual chatbot with GhanaNLP, Rasa, and OpenAI integration

services:
  # Frontend Service - React App
  - type: web
    name: promogo-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install
    startCommand: cd frontend && npx serve -l 3000
    envVars:
      - key: REACT_APP_RASA_URL
        generateValue: true
      - key: REACT_APP_GHANA_NLP_URL
        generateValue: true

  # GhanaNLP Service - STT, TTS, Translation
  - type: web
    name: promogo-ghananlp
    env: python
    plan: free
    buildCommand: cd ghananlp && pip install -r requirements.txt --break-system-packages
    startCommand: cd ghananlp && python app.py
    envVars:
      - key: GHANA_NLP_API_KEY
        sync: false

  # Rasa Service - Chatbot with Embedded Actions
  - type: web
    name: promogo-rasa
    env: python
    plan: free
    buildCommand: cd rasa && pip install -r requirements.txt --break-system-packages
    startCommand: cd rasa && rasa run --enable-api --cors "*" --actions
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GHANA_NLP_SERVICE_URL
        generateValue: true
