services:
  # Frontend Service
  - type: web
    name: promogo-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install
    startCommand: cd frontend && npx serve -l 3000
    envVars:
      - key: REACT_APP_RASA_URL
        value: https://promogo-rasa.onrender.com/webhooks/rest/webhook
      - key: REACT_APP_GHANA_NLP_URL
        value: https://promogo-ghananlp.onrender.com

  # GhanaNLP Service
  - type: web
    name: promogo-ghananlp
    env: python
    plan: free
    buildCommand: cd ghananlp && pip install -r requirements.txt --break-system-packages
    startCommand: cd ghananlp && python app.py
    envVars:
      - key: GHANA_NLP_API_KEY
        value: your_ghananlp_api_key_here

  # Rasa Service (with embedded actions)
  - type: web
    name: promogo-rasa
    env: python
    plan: free
    buildCommand: cd rasa && pip install -r requirements.txt --break-system-packages
    startCommand: cd rasa && rasa run --enable-api --cors "*" --actions
    envVars:
      - key: OPENAI_API_KEY
        value: your_openai_api_key_here
      - key: GHANA_NLP_SERVICE_URL
        value: https://promogo-ghananlp.onrender.com

  # Note: STT and TTS services are now handled by GhanaNLP service
  # Legacy services removed to reduce costs and complexity
